<title>別府ごはん</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
/* Layout: 品書き (menu-board) list on paper; a map tab with an abstract Beppu map whose area pins filter the list. */
:root{
  --bg:#FBF9F4; --surface:#FFFFFF; --fg:#1F1B18; --muted:#7A7066; --line:#E6DFD3; --dots:#D7CFC2;
  --accent:#B4432A; --accent-soft:#F7E6E0; --accent-fg:#FFFFFF; --chip:#FBF9F4; --chip-line:#CFC6B8; --chip-on:#1F1B18; --chip-on-fg:#FBF9F4;
  --map:#EDE8DE; --sea:#CFE3E6; --road:#DDD6CA;
  --mincho:'Shippori Mincho','Hiragino Mincho ProN',serif; --latin:'Cormorant Garamond',Georgia,serif; --sans:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171412; --surface:#201C19; --fg:#F1EBE3; --muted:#A79C90; --line:#332D28; --dots:#3C352F;
  --accent:#E08A6B; --accent-soft:#3A2620; --accent-fg:#171412; --chip:#171412; --chip-line:#4A423B; --chip-on:#F1EBE3; --chip-on-fg:#171412;
  --map:#24201C; --sea:#1F3034; --road:#332D28; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171412; --surface:#201C19; --fg:#F1EBE3; --muted:#A79C90; --line:#332D28; --dots:#3C352F;
  --accent:#E08A6B; --accent-soft:#3A2620; --accent-fg:#171412; --chip:#171412; --chip-line:#4A423B; --chip-on:#F1EBE3; --chip-on-fg:#171412;
  --map:#24201C; --sea:#1F3034; --road:#332D28; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;padding-inline:0;padding-block:0;overflow-x:hidden}
.app{max-width:600px;margin:0 auto;min-height:100%;padding:0 0 calc(92px + env(safe-area-inset-bottom,0px))}
.hero{padding:24px 20px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:1px solid var(--line)}
.brand .k{font-family:var(--latin);font-style:italic;color:var(--accent);font-size:.95rem;letter-spacing:.03em}
.brand h1{font-family:var(--mincho);font-size:1.7rem;margin:0;line-height:1.1;letter-spacing:.06em;white-space:nowrap}
.brand .sub{font-size:.76rem;color:var(--muted);margin-top:4px;display:block;max-width:220px}
.lang{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;max-width:160px}
.lang button{background:transparent;color:var(--muted);border:1px solid var(--chip-line);border-radius:2px;padding:3px 8px;font:inherit;font-size:.68rem;font-weight:700;cursor:pointer;white-space:nowrap}
.lang button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg);border-color:var(--chip-on)}
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg);border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:10px;margin:12px 20px 4px;border-bottom:1.5px solid var(--fg);padding:6px 2px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:1rem;color:var(--fg);outline:none;font-family:var(--mincho)}
.search svg{width:17px;height:17px;color:var(--muted);flex-shrink:0}
.row{display:flex;gap:6px;overflow-x:auto;padding:6px 20px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row .lbl{flex-shrink:0;font-family:var(--latin);font-style:italic;font-size:.9rem;color:var(--accent);align-self:center;padding-right:2px;min-width:3.2em}
.chip{flex-shrink:0;border:1px solid var(--chip-line);background:var(--chip);color:var(--fg);border-radius:2px;padding:5px 11px;font:inherit;font-size:.8rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg);border-color:var(--chip-on)}
.rows{padding-bottom:6px}
.meta{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 4px;font-size:.78rem;color:var(--muted)}
.meta button{background:none;border:0;color:var(--accent);font:inherit;font-size:.78rem;font-weight:700;cursor:pointer;padding:4px 0}
/* 品書き list */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:14px;padding:15px 20px;border-bottom:1px dotted var(--dots);background:none;border-top:0;border-left:0;border-right:0;text-align:left;font:inherit;color:var(--fg);cursor:pointer;width:100%}
.stamp{width:38px;height:38px;border:1.5px solid var(--accent);color:var(--accent);border-radius:50%;display:grid;place-items:center;font-family:var(--mincho);font-size:.7rem;font-weight:700;flex-shrink:0;transform:rotate(-8deg);line-height:1;text-align:center;padding:2px}
.nm{flex:1;min-width:0}
.nm b{display:block;font-family:var(--mincho);font-size:1.12rem;font-weight:700;letter-spacing:.03em;line-height:1.3}
.nm small{display:block;font-size:.72rem;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr{font-family:var(--latin);font-size:1.05rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.item .hb{width:30px;height:30px;border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;flex-shrink:0;padding:0}
.item .hb svg{width:18px;height:18px}
.item .hb[aria-pressed="true"]{color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:48px 20px;font-size:.95rem}
/* map */
.mapwrap{padding:14px 20px 0}
.map{position:relative;border-radius:14px;overflow:hidden;background:var(--map);aspect-ratio:1/1;max-width:100%;border:1px solid var(--line)}
.map svg{width:100%;height:100%;display:block}
.map .ttl{position:absolute;left:14px;top:12px;font-family:var(--mincho);font-weight:700;font-size:1rem;pointer-events:none}
.map .ttl small{display:block;font-family:var(--latin);font-style:italic;color:var(--accent);font-size:.8rem;font-weight:500}
.pin{position:absolute;transform:translate(-50%,-50%);background:var(--surface);color:var(--fg);border:1px solid var(--chip-line);font-size:.74rem;font-weight:700;padding:6px 10px;border-radius:999px;white-space:nowrap;cursor:pointer;font-family:inherit;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.pin i{font-style:normal;font-family:var(--latin);color:var(--accent);margin-left:5px}
.pin[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.pin[aria-pressed="true"] i{color:var(--accent-fg)}
.maphint{padding:10px 20px 0;font-size:.78rem;color:var(--muted)}
/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;pointer-events:none}
.bar .inner{pointer-events:auto;width:100%;max-width:600px;display:flex;align-items:center;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.bar button{background:none;border:0;color:var(--muted);font:inherit;font-size:.66rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 10px;border-radius:10px;cursor:pointer}
.bar button svg{width:22px;height:22px}
.bar button[aria-pressed="true"]{color:var(--fg)}
.bar .dice{background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:9px 16px;flex-direction:row;font-size:.82rem;transform:translateY(-12px);box-shadow:0 8px 20px rgba(0,0,0,.18);font-family:var(--mincho)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:8;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:600px;background:var(--bg);border-radius:22px 22px 0 0;padding:14px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow-y:auto}
.sheet .handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 2px}
.sheet .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sheet h2{font-family:var(--mincho);font-size:1.6rem;margin:0;line-height:1.2;letter-spacing:.03em}
.sheet h2 small{display:block;font-family:var(--latin);font-style:italic;font-size:1rem;color:var(--muted);font-weight:500}
.sheet .close{background:var(--chip);border:1px solid var(--chip-line);color:var(--fg);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1rem;flex-shrink:0}
.sheet .tags{display:flex;flex-wrap:wrap;gap:6px}
.sheet .tag{font-size:.74rem;border:1px solid var(--chip-line);color:var(--fg);padding:3px 9px;border-radius:2px}
.sheet .note{margin:0;font-size:1rem;line-height:1.8;font-family:var(--mincho)}
.info{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.9rem;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin:0}
.info dt{color:var(--muted);margin:0}.info dd{margin:0;font-variant-numeric:tabular-nums}
.links{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;display:inline-flex;justify-content:center;align-items:center;gap:8px;text-decoration:none;font-size:.9rem;font-weight:700;padding:13px 14px;border-radius:4px;border:1px solid var(--fg);color:var(--fg);background:transparent;min-width:140px;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--fg);color:var(--bg)}
.btn svg{width:16px;height:16px}
.official{margin:-4px 0 0;font-size:.78rem;text-align:center}.official a{color:var(--muted)}
.pick-label{font-family:var(--latin);font-style:italic;color:var(--accent);font-size:1.1rem;text-align:center;margin:0}
.foot{padding:28px 20px 0;font-size:.74rem;color:var(--muted);text-align:center;line-height:1.7}
.foot a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}}
</style>

  cn:{ post:"看 Instagram 帖子", hours:"营业", closed:"休息", title:"别府美食搜索", subtitle:"只收录 @oishii.oita 实际吃过的店", q:"按店名或菜品搜索", area:"地区", genre:"类型", tag:"条件",
       count:n=>`${n} 家`, clear:"清除条件", empty:"暂无符合条件的店，请试着减少条件。",
       ig:"店家官方 Instagram", map:"打开地图", price:"约", foot:"所有店家均为实际到访过的店。营业时间和价格可能变动，出发前请先确认。<br>Instagram: " }
};
const HTML_LANG = {ja:"ja",en:"en",ko:"ko",tw:"zh-Hant",cn:"zh-Hans"};
/* 地図上のエリア位置（％）。エリアを増やしたらここにも足す */
const AREA_POS = { beppu_sta:{x:75.7,y:76.2}, ishigaki:{x:68.6,y:55.0}, tsurumi:{x:41.4,y:63.8}, shonin:{x:64.3,y:32.5}, kannawa:{x:41.4,y:26.3}, kamegawa:{x:61.4,y:17.5}, horita:{x:22.9,y:81.3}, myoban:{x:14,y:30}, oita:{x:72,y:93}, yufuin:{x:10,y:58} };
/* 朱印に入れる短い地名（日本語のみ・2〜3文字） */
const STAMP = { beppu_sta:"駅前", ishigaki:"石垣", tsurumi:"鶴見", shonin:"上人", kannawa:"鉄輪", kamegawa:"亀川", horita:"堀田", myoban:"明礬", oita:"大分", yufuin:"湯布院" };
const UI2 = {
  ja:{ all:"品書き", map:"地図から", fav:"お気に入り", dice:"このあとどこ行く？", pick:"ここに行こう", again:"もう一回", favEmpty:"ハートを押したお店がここに並びます。", mapttl:"別府", maphint:"エリアをタップすると、そのエリアのお店だけ表示します。" },
  en:{ all:"List", map:"Map", fav:"Saved", dice:"Where to next?", pick:"Go here", again:"Pick again", favEmpty:"Tap the heart on a place to save it here.", mapttl:"Beppu", maphint:"Tap an area to see only its places." },
  ko:{ all:"목록", map:"지도", fav:"저장", dice:"이제 어디 갈까?", pick:"여기로 가자", again:"다시 뽑기", favEmpty:"하트를 누른 가게가 여기에 모입니다.", mapttl:"벳푸", maphint:"지역을 누르면 그 지역의 가게만 표시됩니다." },
  tw:{ all:"清單", map:"地圖", fav:"收藏", dice:"接下來去哪？", pick:"就去這家", again:"再抽一次", favEmpty:"點了愛心的店會出現在這裡。", mapttl:"別府", maphint:"點選地區，只顯示該地區的店。" },
  cn:{ all:"清单", map:"地图", fav:"收藏", dice:"接下来去哪？", pick:"就去这家", again:"再抽一次", favEmpty:"点了爱心的店会出现在这里。", mapttl:"别府", maphint:"点选地区，只显示该地区的店。" } };

let lang="ja", view="all", state={q:"",area:null,genre:null,tags:new Set()}, favs=new Set();
try{ const s=JSON.parse(localStorage.getItem("bg-state3")||"null"); if(s){ lang=s.lang||"ja"; state.area=s.area||null; state.genre=s.genre||null; state.tags=new Set(s.tags||[]); favs=new Set(s.favs||[]);} }catch(e){}
function save(){ try{ localStorage.setItem("bg-state3",JSON.stringify({lang,area:state.area,genre:state.genre,tags:[...state.tags],favs:[...favs]})); }catch(e){} }
const $=id=>document.getElementById(id);
const t=(cat,key)=>(DICT[cat][key]||{})[lang]||(DICT[cat][key]||{}).en||key;
const sid=s=>s.name.ja;
const esc=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const heart=f=>`<svg viewBox="0 0 24 24" fill="${f?"currentColor":"none"}" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.6-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.4-9 9-9 9z"/></svg>`;
const icon=n=> n==="ig"?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-6-5.3-6-11a6 6 0 0 1 12 0c0 5.7-6 11-6 11z"/><circle cx="12" cy="10" r="2.5"/></svg>';

function chip(label,on,cb){ const b=document.createElement("button"); b.type="button"; b.className="chip"; b.textContent=label; b.setAttribute("aria-pressed",on?"true":"false"); b.addEventListener("click",cb); return b; }
function renderRows(){
  const used=cat=>new Set(STORES.flatMap(s=>cat==="tag"?s.tags:[s[cat]]));
  [["area","row-area"],["genre","row-genre"],["tag","row-tag"]].forEach(([cat,rowId])=>{
    const row=$(rowId); [...row.querySelectorAll(".chip")].forEach(c=>c.remove());
    Object.keys(DICT[cat]).filter(k=>used(cat).has(k)).forEach(k=>{
      const on = cat==="tag" ? state.tags.has(k) : state[cat]===k;
      row.appendChild(chip(t(cat,k),on,()=>{ if(cat==="tag"){ state.tags.has(k)?state.tags.delete(k):state.tags.add(k);} else { state[cat]=state[cat]===k?null:k; } save(); render(); }));
    });
  });
}
function baseMatch(s,ignoreArea){
  const q=state.q.trim().toLowerCase();
  if(q){ const hay=[...Object.values(s.name),...Object.values(s.note),t("genre",s.genre),t("area",s.area),...s.tags.map(x=>t("tag",x))].join(" ").toLowerCase(); if(!hay.includes(q)) return false; }
  if(!ignoreArea && state.area && s.area!==state.area) return false;
  if(state.genre && s.genre!==state.genre) return false;
  for(const tg of state.tags) if(!s.tags.includes(tg)) return false;
  return true;
}
const match=s=> baseMatch(s,false) && (view!=="fav" || favs.has(sid(s)));
function renderMap(){
  const map=$("map"); [...map.querySelectorAll(".pin")].forEach(p=>p.remove());
  const counts={}; STORES.filter(s=>baseMatch(s,true)).forEach(s=>counts[s.area]=(counts[s.area]||0)+1);
  Object.keys(AREA_POS).forEach(k=>{ const p=AREA_POS[k]; const n=counts[k]||0;
    const b=document.createElement("button"); b.type="button"; b.className="pin"; b.style.left=p.x+"%"; b.style.top=p.y+"%";
    b.innerHTML=`${esc(t("area",k))}<i>${n}</i>`; b.setAttribute("aria-pressed",state.area===k); if(!n){ b.disabled=true; b.style.opacity=".45"; }
    b.addEventListener("click",()=>{ state.area=state.area===k?null:k; save(); render(); if(state.area){ setTimeout(()=>$("list").scrollIntoView({behavior:"smooth",block:"start"}),50);} });
    map.appendChild(b); });
  $("map-ttl").innerHTML=`${esc(UI2[lang].mapttl)}<small>${esc(UI2[lang].map)}</small>`; $("maphint").textContent=UI2[lang].maphint;
}
function itemHTML(s){
  const u=UI[lang];
  const bits=[t("genre",s.genre)]; if(s.closed) bits.push(`${u.closed} ${t("day",s.closed)}`); if(s.hours) bits.push(s.hours);
  return `<span class="stamp">${esc(STAMP[s.area]||t("area",s.area))}</span>
    <span class="nm"><b>${esc(s.name[lang]||s.name.en)}</b><small>${esc(bits.join(" ｜ "))}</small></span>
    <span class="pr">${s.price?"¥"+s.price.toLocaleString():"—"}</span>
    <button type="button" class="hb" aria-pressed="${favs.has(sid(s))}" aria-label="save">${heart(favs.has(sid(s)))}</button>`;
}
function render(){
  const u=UI[lang], u2=UI2[lang]; document.documentElement.lang=HTML_LANG[lang]||lang;
  $("subtitle").textContent=u.subtitle; $("q").placeholder=u.q;
  $("lbl-area").textContent=u.area; $("lbl-genre").textContent=u.genre; $("lbl-tag").textContent=u.tag; $("clear").textContent=u.clear;
  $("t-all").textContent=u2.all; $("t-map").textContent=u2.map; $("t-fav").textContent=u2.fav; $("t-dice").textContent=u2.dice;
  ["all","map","fav"].forEach(v=>$("tab-"+v).setAttribute("aria-pressed",view===v));
  $("mapview").hidden = view!=="map"; $("tools").hidden = view==="map";
  $("foot").innerHTML=u.foot+'<a href="https://www.instagram.com/oishii.oita" target="_blank" rel="noopener">@oishii.oita</a>';
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang?"true":"false"));
  renderRows(); if(view==="map") renderMap();
  const hits=STORES.filter(match); $("count").textContent=u.count(hits.length)+(state.area?" ・ "+t("area",state.area):"");
  const list=$("list"); list.innerHTML="";
  hits.forEach(s=>{ const c=document.createElement("button"); c.type="button"; c.className="item"; c.innerHTML=itemHTML(s);
    c.addEventListener("click",e=>{ if(e.target.closest(".hb")) return; openSheet(s); });
    c.querySelector(".hb").addEventListener("click",e=>{ e.stopPropagation(); const k=sid(s); favs.has(k)?favs.delete(k):favs.add(k); save(); render(); });
    list.appendChild(c); });
  $("empty").textContent= view==="fav"&&!favs.size ? u2.favEmpty : u.empty; $("empty").hidden=hits.length>0;
}
function openSheet(s,picked){
  const u=UI[lang], u2=UI2[lang]; const root=$("sheet-root"); const other=lang==="ja"?s.name.en:s.name.ja;
  root.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="handle"></div>
    ${picked?`<p class="pick-label">${esc(u2.pick)}</p>`:""}
    <div class="top"><h2>${esc(s.name[lang]||s.name.en)}<small>${esc(other)}</small></h2><button type="button" class="close" id="close" aria-label="close">✕</button></div>
    <div class="tags"><span class="tag">${esc(t("area",s.area))}</span><span class="tag">${esc(t("genre",s.genre))}</span>${s.tags.map(x=>`<span class="tag">${esc(t("tag",x))}</span>`).join("")}</div>
    <p class="note">${esc(s.note[lang]||s.note.en||"")}</p>
    ${(s.hours||s.closed||s.pay||s.price)?`<dl class="info">${s.price?`<dt>${esc(u.price)}</dt><dd>¥${s.price.toLocaleString()}</dd>`:""}${s.hours?`<dt>${esc(u.hours)}</dt><dd>${esc(s.hours)}</dd>`:""}${s.closed?`<dt>${esc(u.closed)}</dt><dd>${esc(t("day",s.closed))}</dd>`:""}${s.pay?`<dt>Pay</dt><dd>${esc(t("pay",s.pay))}</dd>`:""}</dl>`:""}
    <div class="links">${s.post?`<a class="btn primary" href="${s.post}" target="_blank" rel="noopener">${icon("ig")}${esc(u.post)}</a>`:""}<a class="btn ${s.post?"":"primary"}" href="${s.map}" target="_blank" rel="noopener">${icon("map")}${esc(u.map)}</a>${picked?`<button type="button" class="btn" id="again">${esc(u2.again)}</button>`:""}</div>
    ${s.ig?`<p class="official"><a href="${s.ig}" target="_blank" rel="noopener">${esc(u.ig)} ↗</a></p>`:""}</div>
  </div></div>`;
  const close=()=>{ root.innerHTML=""; };
  $("close").addEventListener("click",close); $("scrim").addEventListener("click",e=>{ if(e.target.id==="scrim") close(); });
  if(picked) $("again").addEventListener("click",()=>pick());
  document.addEventListener("keydown",function esc_(e){ if(e.key==="Escape"){ close(); document.removeEventListener("keydown",esc_);} });
}
function pick(){ const pool=STORES.filter(s=>baseMatch(s,false)); if(!pool.length) return; openSheet(pool[Math.floor(Math.random()*pool.length)],true); }
$("q").addEventListener("input",e=>{ state.q=e.target.value; render(); });
$("clear").addEventListener("click",()=>{ state={q:"",area:null,genre:null,tags:new Set()}; $("q").value=""; save(); render(); });
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{ lang=b.dataset.lang; save(); render(); }));
["all","map","fav"].forEach(v=>$("tab-"+v).addEventListener("click",()=>{ view=v; render(); window.scrollTo({top:0}); }));
$("dice").addEventListener("click",pick);
render();
</script>
